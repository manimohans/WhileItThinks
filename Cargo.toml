[package]
name = "whileitthinks"
version = "0.1.0"
edition = "2021"
description = "Local wait-state router for Claude Code and Codex"
license = "MIT"

[lib]
name = "whileitthinks"
path = "src/lib.rs"

[[bin]]
name = "whileitthinks"
path = "src/bin/whileitthinks.rs"

[[bin]]
name = "whileitthinks-hook"
path = "src/bin/whileitthinks-hook.rs"

[[bin]]
name = "whileitthinksd"
path = "src/bin/whileitthinksd.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.42", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.14"
